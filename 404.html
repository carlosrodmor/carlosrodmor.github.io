<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect solution
    // Captura la ruta solicitada y redirige a index.html
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;

    // Guarda la ruta original en sessionStorage
    sessionStorage.setItem('redirect', path + search + hash);

    // Redirige a la raíz
    window.location.replace('/');
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
